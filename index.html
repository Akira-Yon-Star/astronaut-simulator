<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b14">
<meta name="description" content="Posto Avançado: simulador educacional de sobrevivência em bases na Lua e em Marte, com pilotagem e dados reais da NASA.">
<title>Posto Avançado · Centro de Controle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a1424' stroke='%2363ddff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23ffc45c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root{
 color-scheme:dark;
 --bg:#060b14;--p1:#14243a;--p2:#0a1422;--ink:#06101b;
 --line:#2d4a68;--line2:#456d93;
 --tx:#e8f3ff;--dm:#9db3cc;
 --am:#ffc45c;--cy:#63ddff;--gr:#65e6a0;--rd:#ff777d;--pk:#ff86a8;
 --r:14px;
 --fh:Rajdhani,system-ui,sans-serif;--fb:Barlow,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.45 var(--fb);letter-spacing:.01em;
 background:radial-gradient(1100px 650px at 50% -10%,#1d3a5e 0,#0a1424 55%,#05080f 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:linear-gradient(#63ddff08 1px,transparent 1px) 0 0/100% 40px,linear-gradient(90deg,#63ddff08 1px,transparent 1px) 0 0/40px 100%}
main{max-width:1560px;margin:0 auto;padding:clamp(10px,2vw,28px);padding-bottom:calc(clamp(10px,2vw,28px) + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.n{font-family:var(--fh)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--cy);outline-offset:3px;border-radius:6px}
ul,ol{padding-left:20px;margin:6px 0}
.skip{position:absolute;left:-999px;top:0;background:var(--cy);color:var(--ink);padding:8px 14px;z-index:50;border-radius:0 0 8px 0}.skip:focus{left:0}
.dm{color:var(--dm);font-size:.8rem;line-height:1.3;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ Painéis ============ */
.pn{position:relative;background:linear-gradient(150deg,#17304a 0%,var(--p2) 55%,#060f19 100%);border:1px solid var(--line);border-radius:var(--r);
 box-shadow:0 16px 36px #0007,inset 0 1px #ffffff14,inset 0 0 26px #63ddff0d;padding:14px;min-width:0}
.pn::before,.pn::after{content:"";position:absolute;top:7px;width:6px;height:6px;border-radius:50%;background:radial-gradient(#d7efff,#47718f)}
.pn::before{left:8px}.pn::after{right:8px}
.pn h3{display:block;margin:0 0 10px;padding:0 0 5px;border-bottom:1px solid #1f6a8a;color:#7fe6ff;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 8px #3fd0ff66}
.pn h3.sub{margin-top:12px}
.scr{background:repeating-linear-gradient(0deg,#0000 0 3px,#7eeaff0a 3px 4px),radial-gradient(ellipse at 50% 45%,#0b4050,#03141f 80%);
 border:4px solid #1b2c3d;border-radius:8px;box-shadow:inset 0 0 30px #000,0 0 0 1px #45657f,0 0 16px #4adfff22;color:#9ff}
svg.scr{display:block;width:100%;height:auto}
svg.scr.sq{max-width:190px;margin:0 auto}
.lcd{background:linear-gradient(135deg,#d9f2c9,#a9d19c);color:#15251b;border:3px solid #526d59;border-radius:8px;padding:6px 12px;font:600 .95rem var(--fh);box-shadow:inset 0 0 8px #0005}
.lcd b{font-size:1.25rem;display:block}

/* ============ Intro ============ */
.intro{text-align:center;padding:clamp(18px,5vw,54px) 0 24px}
.badge{display:inline-flex;padding:7px 14px;border:1px solid #3b7aa0;border-radius:99px;color:#8de5ff;background:#0b2135;font:700 .72rem var(--fb);letter-spacing:.16em;box-shadow:0 0 22px #4bdcff33}
.intro h1{margin:16px 0 0;font-size:clamp(3rem,9vw,6rem);line-height:.95;letter-spacing:-.03em;background:linear-gradient(100deg,#fff 10%,#9ceaff 55%,#b9c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro>p{max-width:680px;margin:14px auto;color:#bcd0e6;font-size:1.08rem}
.intro h2.n{margin:22px 0 8px;font-size:1.3rem}
.chs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.intro .chs{justify-content:center}
.ch{padding:6px 14px;border-radius:20px;border:2px solid #405c7b;background:#101e32;color:#e5f1ff;font-weight:600;transition:.18s}
.ch:hover{border-color:#78ddff}.ch[aria-pressed=true]{border-color:var(--am);color:#ffd27b;background:#382a17}
.ch:disabled{opacity:.4;cursor:not-allowed}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:820px;margin:12px auto}
.level{padding:12px;border:1px solid #38536d;border-radius:12px;background:#101b2d;text-align:left}
.level b{display:block;color:var(--am);font:700 1.05rem var(--fh)}.level small{display:block;color:var(--dm);line-height:1.35;margin-top:4px}
.level.active{border:2px solid var(--cy);background:#142a40;box-shadow:0 0 16px #3fd0ff33}
.sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin:14px auto 0;max-width:900px;text-align:left}
.site{display:block;width:100%;text-align:left;min-height:170px;transition:transform .2s,border-color .2s,box-shadow .2s}
.site:hover{transform:translateY(-4px);border-color:#73dfff;box-shadow:0 18px 35px #0008,0 0 24px #47cfff22}
.site h2{margin:0;font-size:2rem}.site p{margin:6px 0 10px;color:#bcd0e6}
.resume{max-width:900px;margin:18px auto 0;min-height:0;border-color:var(--am)}
.factbox{margin:18px auto 0;max-width:900px;text-align:left;padding:16px 18px;border:1px solid #315477;border-radius:var(--r);background:linear-gradient(120deg,#10243a,#0c182a);color:#d9e8f8}
.factbox strong{color:#8de5ff;letter-spacing:.1em}
.model-note{display:block;margin-top:8px;color:#ffd27b;font-size:.82rem}

/* ============ Cabine ============ */
.strip{padding:14px 18px}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.bar h2{margin:0;font-size:1.5rem}
.crew{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 .9rem var(--fh);color:#08101a;border:2px solid #1b2230;font-style:normal;cursor:pointer}
.anns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;background:#081321;border:1px solid #1e3450;padding:6px;border-radius:8px}
.an{font:600 .72rem var(--fh);text-transform:uppercase;letter-spacing:.06em;padding:4px 10px 4px 22px;border-radius:4px;background:#15253b;color:#91a6c1;position:relative;border:0}
.an::before{content:"";position:absolute;left:7px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#2a3446}
button.an{cursor:pointer}
.an.a{color:var(--am)}.an.a::before{background:var(--am);box-shadow:0 0 8px var(--am)}
.an.r{color:var(--rd)}.an.r::before{background:var(--rd);box-shadow:0 0 8px var(--rd)}
.bank{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-top:8px;background:#081321;padding:6px 8px;border-radius:8px}
.bank i{width:9px;height:9px;border-radius:50%;background:#2a3446}.bank i.on{background:var(--gr);box-shadow:0 0 6px var(--gr)}
.bank .dm{display:inline;margin:0 8px}

.ck{display:grid;gap:14px;margin-top:12px}
.ck-canopy{max-width:1100px;width:100%;margin:0 auto}
.win{border:10px solid #1b2c3d;border-radius:50% 50% 12px 12px/55% 55% 12px 12px;overflow:hidden;box-shadow:0 0 0 3px #56738f,inset 0 0 70px #000,0 18px 42px #0008}
.win svg{display:block;width:100%;height:auto}
.ck-deck{display:grid;gap:12px;grid-template-columns:.85fr .95fr 1.7fr .95fr .85fr;align-items:start;perspective:1400px}
.ck-main{border-color:#7fe8ff;box-shadow:0 0 0 3px #080c14,0 0 30px #3fd0ff55,inset 0 0 26px #3fd0ff22}
.ck-ol{transform:rotateY(18deg) scale(.97);transform-origin:right center}.ck-il{transform:rotateY(8deg);transform-origin:right center}
.ck-ir{transform:rotateY(-8deg);transform-origin:left center}.ck-or{transform:rotateY(-18deg) scale(.97);transform-origin:left center}
.ck-low{display:grid;gap:12px;grid-template-columns:.8fr 1.1fr 1.3fr 1fr;align-items:start}
.ck-radio{display:grid;gap:12px;grid-template-columns:1.2fr 1fr}
.ck-svg{display:block;width:100%;max-width:130px;margin:0 auto}
.ck-hand{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;text-align:center}
.ck-suit{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #2a3d59}.ck-suit span{flex:1}
.ck-rf{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font:600 .85rem var(--fh)}.ck-rf span{display:flex;gap:6px;align-items:center}
.ck-clk{cursor:pointer;border-radius:8px}.ck-clk:hover{outline:2px solid #63ddff55;outline-offset:2px}
[data-ctl]{touch-action:none;user-select:none;-webkit-user-select:none}
svg[data-ctl]{cursor:grab}svg[data-ctl]:active{cursor:grabbing}

.dials{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dl{text-align:center}.dl svg{width:100%;max-width:150px}.dl b{display:block;font:700 .95rem var(--fh);color:#f0f6ff}.dl small{display:block;font-size:.75rem;color:#a9c0d8;line-height:1.2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.log{max-height:190px;overflow:auto;padding:10px;font-size:.9rem}.log p{margin:0 0 6px}
.tip{color:#ffc15c}.fact{color:#7be8ff}.alert{color:#ff8a80}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;margin-top:4px;background:#081321;padding:3px 8px;border-radius:6px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #2a3d59}.row:last-child{border:0}.row>span{flex:1}.row b{color:#e6f6ff}
.led{width:12px;height:12px;border-radius:50%;background:#2a3446;flex:none;box-shadow:inset 0 0 3px #000}.led.on{background:var(--gr);box-shadow:0 0 8px var(--gr)}.led.bad{background:var(--rd);box-shadow:0 0 8px var(--rd)}
.sw{width:58px;height:28px;background:#1b2230;border:2px solid #4a6177;border-radius:16px;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:linear-gradient(#f1f5fa,#8793a3);transition:left .2s}
.sw[aria-pressed=true]{border-color:var(--gr)}.sw[aria-pressed=true]::after{left:32px}
.seg{display:flex;gap:2px;margin:3px 0 8px;background:#081321;padding:4px;border-radius:5px}.seg i{flex:1;height:12px;border-radius:2px}
.parts{font:700 1.3rem var(--fh);color:var(--am);display:block;margin-bottom:6px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.key{background:linear-gradient(#0e2a3a,#081824);border:2px solid #2aa6c8;border-left:7px solid var(--k);border-radius:8px;color:#bff4ff;padding:6px 8px;text-align:left;display:flex;flex-direction:column;box-shadow:0 0 8px #3fd0ff33,0 4px 0 #07101c;transition:filter .15s,transform .15s}
.key:hover:not(:disabled){filter:brightness(1.18);transform:translateY(-2px)}
.key:active:not(:disabled){transform:translateY(2px)}
.key:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.key b{font:700 .95rem var(--fh)}.key small{font-size:.68rem;line-height:1.2;color:#9fc4d8}.key em{font:700 .85rem var(--fh);font-style:normal;margin-top:2px;color:var(--am)}
.haz{background:repeating-linear-gradient(-45deg,#ffd447 0 12px,#1b2230 12px 24px);padding:10px;border-radius:12px;display:grid}
.bigbtn{min-height:84px;border-radius:50px;background:radial-gradient(circle at 35% 30%,#ff8a7a,#d1241a 55%,#7a0d08);color:#fff;font:700 1.3rem/1.1 var(--fh);letter-spacing:.04em;border:4px solid #1b2230;box-shadow:0 6px 0 #5a0a06,0 0 18px #ff554477}
.bigbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #5a0a06}
.ck-abort{width:100%;min-height:56px;margin-top:12px;border-radius:12px;background:#3a0f10;border:3px solid var(--rd);color:#ffd8d6;font:700 1.05rem var(--fh);letter-spacing:.06em}.ck-abort:hover{background:#561416}
.go{background:linear-gradient(110deg,#ffd47d,#ffad35);color:#241800;font:700 1.2rem var(--fh);padding:12px 22px;border-radius:12px;width:100%;box-shadow:0 4px 0 #a96b17;margin-top:10px}
.go.alt{background:#16435a;color:#e6f6ff;box-shadow:0 4px 0 #0b2535}
.edu{padding:10px}.edu p{margin:0}
.flow{animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-12}}
.sweep{transform-origin:80px 80px;animation:sw 4s linear infinite}@keyframes sw{to{transform:rotate(360deg)}}
.mx{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#081321;padding:6px;border-radius:6px}
.mx i{height:32px;border-radius:4px;font:700 .6rem/32px var(--fh);text-align:center;color:#06101b;font-style:normal;box-shadow:inset 0 -3px #0004;white-space:nowrap;overflow:hidden}
.sls{display:flex;justify-content:space-around;margin-top:4px}.sl{text-align:center}
.sl .tr{position:relative;width:14px;height:90px;background:#081321;border-radius:7px;margin:0 auto 4px}
.sl .tr i{position:absolute;left:-6px;width:26px;height:12px;border-radius:3px;border:2px solid #1b2230}
.sl b,.kn b{font:600 .72rem var(--fh);display:block}.kns{display:flex;justify-content:space-around;margin-top:10px}.kn{text-align:center}.kn svg{width:54px}
.ck-lev{width:30px!important;cursor:ns-resize}.ck .ck-lev i{left:2px!important}
.ck-peds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.ck-ped{height:46px;border-radius:8px;background:linear-gradient(#2b3a52,#141c2a);border:2px solid #56637a;border-bottom-width:6px;color:#cfe0ff;font:700 .85rem var(--fh)}
.ck-ped.down{border-bottom-width:2px;transform:translateY(4px);border-color:var(--cy);color:var(--cy)}

/* Pilotagem */
.ck-rudder{margin:10px 0 6px;padding:9px;border:1px solid #38536d;border-radius:10px;background:linear-gradient(145deg,#0b1726,#101f31)}
.ck-rudder-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 .85rem var(--fh);color:#cfe0ff}
.ck-rudder-readout{font:700 1.15rem var(--fh);color:var(--cy);font-variant-numeric:tabular-nums}
.ck-rudder svg{display:block;width:100%;max-width:230px;height:auto;margin:2px auto}
.ck-rudder-state{text-align:center;font:700 .78rem var(--fh);letter-spacing:.1em;color:var(--am)}
.ck-rudder-legend{display:flex;justify-content:space-between;color:#8fa6c2;font-size:.68rem}
.ck-flight{margin-top:10px;padding:10px;border:1px solid #2a6d86;border-radius:10px;background:linear-gradient(135deg,#0b2030,#101b2d)}
.ck-flight-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ck-flight button.act{background:#16435a;border:1px solid var(--cy);border-radius:8px;padding:8px 12px;font-weight:700;color:#e6f6ff}.ck-flight button.act:hover{background:#1d5c76}
.ck-mission-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.ck-mission-tabs .ch{font-size:.76rem;padding:5px 9px}
.ck-mission-grid{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;margin:8px 0}.ck-mission-grid svg{width:112px;max-width:100%}
.ck-mission-name{font:700 1.1rem var(--fh);color:#eaf7ff}
.ck-mission-tag{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:5px;background:#203650;color:var(--am);font:700 .65rem var(--fh);letter-spacing:.06em}
.ck-flight .dm{margin:4px 0}
.ck-flight-meter{height:10px;background:#07111d;border:1px solid #38536d;border-radius:20px;overflow:hidden;margin:10px 0}
.ck-flight-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rd),var(--am),var(--gr));transition:width .2s}
.ck-flight-telemetry{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:10px 0}
.ck-flight-stat{padding:8px;border:1px solid #304b68;border-radius:8px;background:#091725;min-width:0}
.ck-flight-stat small{display:block;color:#8fa6c2;font-size:.66rem;letter-spacing:.04em}
.ck-flight-stat b{display:block;color:#dff6ff;font:700 1rem var(--fh);overflow-wrap:anywhere}
.ck-flight-stat.warn b{color:#ffb45c}
.ck-flight-actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.ck-flight-actions button{font-size:.76rem;padding:7px 9px}
.ck-control-guide{margin-top:8px;padding:8px;border-radius:8px;background:#0a1725;border:1px dashed #38536d;color:#9eb2cc;font-size:.75rem;line-height:1.5}.ck-control-guide b{color:#dff6ff}

/* Modais e toast */
.modal{position:fixed;inset:0;background:#030914ee;backdrop-filter:blur(9px);display:grid;place-items:center;padding:16px;z-index:30;overflow:auto}
.modal>.pn{max-width:580px;width:100%;border-color:var(--line2)}
.modal h2{font-size:1.8rem;margin:0 0 4px}
.bc{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--rd);margin-right:8px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.15}}
.opt{display:block;width:100%;text-align:left;margin-top:10px;background:#10223a;color:#e8f0ff;border:2px solid #2d4868;border-radius:9px;padding:11px 14px}
.opt:hover{border-color:#78ddff;background:#17304e}.opt small{display:block;color:#9fb0c8}
.rec{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--am);color:#241800;font:700 .8rem var(--fh);letter-spacing:.08em;margin-left:8px;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(560px,92vw);background:#08182a;border:2px solid var(--cy);color:#e6f6ff;padding:10px 16px;border-radius:12px;box-shadow:0 0 24px #3fd0ff66;opacity:0;pointer-events:none;transition:.25s;z-index:40}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* NASA e fontes */
.nasa-api{margin-top:14px;background:linear-gradient(145deg,#0b2638,#061723);border:1px solid #376078;border-radius:var(--r);padding:16px;color:#eaf4ff;text-align:left}
.nasa-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.nasa-head h3{margin:0;color:#8de5ff;font:700 1rem var(--fb);letter-spacing:.09em;text-transform:uppercase}
.nasa-refresh{border:1px solid #5bc8e4;border-radius:9px;padding:8px 12px;background:#0d3042;color:#eaf4ff;font-weight:700}
.nasa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.nasa-card{background:linear-gradient(145deg,#0b1d2b,#06131e);border:1px solid #376078;border-radius:10px;padding:12px;min-width:0}
.nasa-card h4{margin:0 0 7px;color:#8de5ff;font:700 .9rem var(--fb)}
.nasa-card p{margin:5px 0;color:#c4d3e6;font-size:.88rem;line-height:1.4}.nasa-card small{color:#91a9c4}
.nasa-event{padding:8px 0;border-bottom:1px solid #263f5c}.nasa-event:last-child{border:0}
.nasa-photo{width:100%;max-height:155px;object-fit:cover;border-radius:7px;margin-top:7px;background:#07101c}
.nasa-status{color:#ffd27b;font-size:.8rem;margin-top:10px}
.nasa-link,.sources a{color:#8de5ff;text-decoration:none}.nasa-link:hover,.sources a:hover{text-decoration:underline}
.sources{margin-top:14px;background:#0b1728;border:1px solid #2a4564;border-radius:12px;padding:14px 16px;color:#c4d3e6;font-size:.82rem}
.sources h3{margin:0 0 8px;color:#8de5ff;font:700 .82rem var(--fb);letter-spacing:.1em;text-transform:uppercase;border:0;padding:0;text-shadow:none}
.sources ul{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding-left:18px}
footer{margin:22px 0 4px;text-align:center;color:#7f95b0;font-size:.78rem}

/* ============ Responsivo ============ */
@media(max-width:1250px){.ck-deck{grid-template-columns:1fr 1fr;perspective:none}.ck-main{grid-column:1/-1;order:-1}.ck-ol,.ck-il,.ck-ir,.ck-or{transform:none}.ck-low{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.ck-deck,.ck-low,.ck-radio,.two,.levels{grid-template-columns:1fr}.sites{grid-template-columns:1fr}.sources ul{display:block}.sources li{margin:5px 0}.ck-flight-telemetry{grid-template-columns:repeat(2,minmax(0,1fr))}.win{border-width:6px}}
@media(max-width:480px){.ck-mission-grid{grid-template-columns:1fr}.ck-mission-grid svg{width:100px}.pn{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{body{background:#fff;color:#000}.modal,#toast{display:none}}

/* ============ Periféricos, caixa de botões, MFD e imersão ============ */
body.head-on .win svg{transform:translate(var(--hx,0px),var(--hy,0px)) scale(1.1);transition:transform .12s linear}
.sl .tr .mk{position:absolute;left:-10px;width:34px;height:2px;background:var(--cy);box-shadow:0 0 6px var(--cy);pointer-events:none;text-decoration:none}
.ck-hand.three{grid-template-columns:1fr 1fr 1fr}
.ck-rig{display:grid;gap:12px;grid-template-columns:1.1fr 1fr 1fr;align-items:start}
.mfd-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.mfd-nav svg{width:100%;max-width:230px;margin:0 auto;display:block}
.bb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.bb-cell{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 4px;border:1px solid #2a4560;border-radius:10px;background:#081321}
.bb-cell b{font:700 .78rem var(--fh);letter-spacing:.06em}.bb-cell small{font-size:.66rem;color:var(--dm);line-height:1.2}
.bb-led{width:10px;height:10px;border-radius:50%;background:#2a3446}.bb-led.on{background:var(--gr);box-shadow:0 0 8px var(--gr)}
.bb-toggle{width:34px;height:58px;border-radius:8px;background:linear-gradient(#0c1119,#1b2433);border:2px solid #56637a;position:relative}
.bb-toggle i{position:absolute;left:5px;right:5px;height:24px;border-radius:5px;background:linear-gradient(#f1f5fa,#8793a3);bottom:5px;transition:bottom .15s}
.bb-toggle.on{border-color:var(--gr)}.bb-toggle.on i{bottom:25px}
.bb-cover{width:44px;height:58px;border-radius:8px;background:repeating-linear-gradient(-45deg,#ffd447 0 8px,#1b2230 8px 16px);color:#fff;font:700 .6rem var(--fh);border:2px solid #7a6a20;text-shadow:0 1px 2px #000}
.bb-rot{width:62px;height:62px;border-radius:50%}.bb-rot svg{width:100%}
.bb-push{padding:10px 8px;border-radius:8px;background:linear-gradient(#2b3a52,#141c2a);border:2px solid #56637a;border-bottom-width:5px;font:700 .74rem var(--fh);letter-spacing:.06em;color:#cfe0ff;width:100%}
.bb-push:active:not(:disabled){border-bottom-width:2px;transform:translateY(3px)}.bb-push:disabled{opacity:.45;cursor:not-allowed}
.bb-push.caution{background:linear-gradient(#4a3510,#2a1d08);border-color:var(--am);color:var(--am)}
.bb-push.caution.blink{animation:bl .8s infinite}
.rg{display:grid;grid-template-columns:1fr 1fr 44px;align-items:center;gap:8px;font-size:.82rem;margin:6px 0;color:var(--dm)}
.rg input{width:100%;accent-color:var(--cy)}.rg output{font:700 .8rem var(--fh);color:var(--cy);text-align:right}
.pad{padding:6px 8px;border:1px solid #2a4560;border-radius:8px;background:#081321;margin:4px 0;font-size:.8rem;color:#cfe0ff;overflow-wrap:anywhere}
.gd{padding:8px 0;border-bottom:1px solid #2a3d59}.gd:last-child{border:0}.gd b{color:#e6f6ff}.gd p{margin:3px 0;font-size:.82rem;color:var(--dm)}.gd .g{color:#7fe6ff}
@media(max-width:1250px){.ck-rig{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.ck-rig,.mfd-nav{grid-template-columns:1fr}.ck-hand.three{grid-template-columns:1fr}.bb{grid-template-columns:repeat(2,1fr)}}

<body>
<a class="skip" href="#app">Pular para o conteúdo</a>
<main id="app" aria-live="off"></main>
<noscript><p style="padding:24px;text-align:center">Este simulador precisa de JavaScript para funcionar.</p></noscript>
<script>
'use strict';
/* ============================================================
   POSTO AVANÇADO · v6
   Estrutura: dados → persistência → motor → visões → entrada → NASA → boot
   ============================================================ */

/* ---------- Dados e constantes ---------- */
const MAXD=20,BASE={solar:3,oxy:4,rec:4,farm:4,shield:3,batt:3};
const INFO={solar:['Painéis solares','Geram energia só com luz.'],oxy:['Geradores de O₂','Fazem ar; gastam muita energia.'],rec:['Recicladores de água','Reaproveitam água; gastam energia.'],farm:['Estufas','Produzem comida; gastam água e energia.'],shield:['Blindagem (nível)','Reduz a radiação. Cada nível custa mais.'],batt:['Baterias','Guardam energia para a noite.']};
const DN=['Treinamento','Missão','Sobrevivência'],DD=['Mais recursos e mais margem para erro.','Recursos limitados, eventos com mais impacto.','Poucos recursos, mais eventos e radiação forte.'];
const DF=[{r:1.25,e:.4,k:.8,pt:8},{r:.9,e:.6,k:1.15,pt:5},{r:.75,e:.8,k:1.4,pt:4}];
const EDU={'Radiação':'No espaço, o Sol e estrelas distantes lançam partículas que danificam células. A blindagem (solo, água, camadas de material) absorve parte delas. Cada nível custa mais peças: segurança não é de graça.','Oxigênio':'O ar pode ser feito separando a água em hidrogênio e oxigênio com eletricidade (eletrólise). Por isso ar, água e energia andam juntos.','Água':'Na Estação Espacial Internacional mais de 90% da água é reciclada. Cada litro reaproveitado é um litro que não precisa vir da Terra, mas reciclar gasta energia.','Alimentos':'Plantas dão comida e renovam o ar, mas precisam de luz, água e energia. Trazer comida da Terra é mais seguro no começo, mas ocupa espaço e peso.','Energia':'Painéis solares dependem do Sol: a noite lunar dura cerca de 14 dias e Marte recebe cerca de metade da luz da Terra. Baterias guardam energia para esses momentos.','Manutenção':'Poeira, calor e frio desgastam os equipamentos. Peças de reposição e revisões regulares evitam que pequenas falhas virem emergências.'};
const FACTS=['Sem atmosfera, na Lua um astronauta recebe em um dia a radiação que na Terra receberia em cerca de seis meses.','Um dia em Marte dura 24 horas e 39 minutos.','A noite lunar dura cerca de 14 dias terrestres. Aqui ela foi encurtada para caber no jogo.'];
const TUT=['Cada dia, use as peças para construir ou melhorar módulos e ajuste os interruptores de energia.','Veja a previsão abaixo de cada medidor: ela mostra o que vai acontecer hoje.','Nada é de graça: mais ar, água ou comida gasta energia; mais blindagem gasta peças.','Equipamentos se desgastam. Faça manutenção antes que a eficiência caia.','Nos alertas, não existe resposta certa, só trocas. Escolha com cuidado!','Complete as missões de pilotagem (75+ pontos) para ganhar peças extras e pontos no final. O jogo é salvo automaticamente.'];
const CREW=['Ana, comandante','Bruno, engenheiro','Carla, médica','Davi, botânico','Elisa, geóloga','Fábio, piloto'];const CROPS={alface:{n:'Alface e verduras',f:1.3,w:1.4,en:1.1,d:'Crescem rápido e rendem muito, mas bebem bastante água.'},batata:{n:'Batata',f:1,w:1,en:1,d:'Rendimento e consumo equilibrados.'},soja:{n:'Soja e feijão',f:.8,w:.7,en:.8,d:'Rendem menos, mas poupam água e energia e dão proteína.'}};const NC=()=>(S&&S.crew)||4,CR=()=>CROPS[S&&S.crop]||CROPS.batata;
const FLIGHT_MISSIONS=[
 {name:'Alinhamento orbital',tag:'INICIANTE',objective:'Alinhar a nave ao farol orbital e estabilizar a atitude.',goal:{x:.30,y:-.20,th:.55},obstacles:[{x:-.62,y:.55,r:.30,name:'Zona de detritos'}],hint:'Aproxime o manche do marcador azul e mantenha os motores equilibrados.'},
 {name:'Corredor de detritos',tag:'INTERMEDIÁRIA',objective:'Atravessar o corredor sem entrar na área marcada por fragmentos.',goal:{x:-.45,y:.35,th:.42},obstacles:[{x:.28,y:-.35,r:.42,name:'Campo de fragmentos'}],hint:'Faça uma correção suave para a esquerda e para cima; evite o setor vermelho.'},
 {name:'Controle de atitude',tag:'AVANÇADA',objective:'Manter a nave estável enquanto ajusta a potência dos dois motores.',goal:{x:.05,y:-.05,th:.68},obstacles:[{x:-.62,y:.62,r:.32,name:'Área de oscilação'}],hint:'Centralize o manche, aproxime os motores de 68% e mantenha a guinada zerada.'},
 {name:'Acoplagem de precisão',tag:'ESPECIALISTA',objective:'Concluir a aproximação final com baixa potência e alinhamento fino.',goal:{x:.20,y:.15,th:.28},obstacles:[{x:-.52,y:-.52,r:.34,name:'Zona de aproximação proibida'}],hint:'Use movimentos pequenos. Os dois motores devem ficar próximos de 28%.'}
];
const KC={solar:'#ffd447',oxy:'#5ad1ff',rec:'#8fa8ff',farm:'#7be08a',shield:'#ff8aa5',batt:'#ffa14a',maint:'#e8eef7'};

/* ---------- Persistência (sempre protegida por try/catch) ---------- */
const store={
 get(k,d){try{const v=localStorage.getItem('pa6:'+k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem('pa6:'+k,JSON.stringify(v))}catch(e){}},
 del(k){try{localStorage.removeItem('pa6:'+k)}catch(e){}}
};
const prefs=Object.assign({sound:true,profile:'hotas',sens:1,dz:.06,expo:.3,invY:false,head:false,haptic:false,lang:''},store.get('prefs',{}));
const best=store.get('best',{});

/* ---------- Estado global ---------- */
let S=null,D=1;                 // S: partida; D: dificuldade escolhida
const UI={abort:false,mfd:'PWR',gd:0,cover:{}};         // estado transitório de interface (não salvo)
const C={jx:0,jy:0,lx:0,ly:0,th:[.5,.5],link:false,yaw:0,pl:0,pr:0,lastScore:null,attempts:0};
const app=document.getElementById('app');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Áudio (um único contexto, reaproveitado) ---------- */
let AC=null;
function beep(f,d){
 if(!prefs.sound)return;
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.035,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d/1000);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d/1000);
 }catch(e){}
}

/* ---------- Periféricos: curva de eixos, manetes ligadas, háptica ---------- */
function shape(v,dz){dz=dz||0;let a=Math.abs(v);if(a<=dz)return 0;a=(a-dz)/(1-dz);a=(1-prefs.expo)*a+prefs.expo*a*a*a;return v<0?-a:a}
function setTh(i,v){C.th[i]=clamp(v,0,1);if(C.link){C.th[1-i]=C.th[i];levUI(1-i)}}
function centerAll(){C.jx=C.jy=C.lx=C.ly=C.yaw=0;C.pl=C.pr=0;pedUI();att()}
function pads(){try{return[...(navigator.getGamepads?navigator.getGamepads():[])].filter(Boolean)}catch(e){return[]}}
function buzz(p){
 if(!prefs.haptic)return;
 try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}
 try{for(const g of pads()){const a=g.vibrationActuator;if(a&&a.playEffect)a.playEffect('dual-rumble',{duration:Array.isArray(p)?p[0]:p,strongMagnitude:.6,weakMagnitude:.4})}}catch(e){}
}

/* ---------- Motor do jogo ---------- */
const cap=()=>40+S.m.batt*30,sg=n=>(n>=0?'+':'')+n.toFixed(0),sf=()=>Math.max(.2,1-.2*S.m.shield),dn=(k,n)=>S[k]=Math.max(0,S[k]-n),cost=k=>BASE[k]+(k==='shield'?S.m.shield:0),eff=()=>.4+.6*S.cond/100;
const vals=()=>[S.o2,S.wa,S.food,S.en/cap()*100,S.h];
const goal=()=>FLIGHT_MISSIONS[S.fl.i].goal;

function resetControls(){C.jx=0;C.jy=0;C.lx=0;C.ly=0;C.th=[.5,.5];C.yaw=0;C.pl=C.pr=0;C.lastScore=null;C.attempts=0}

function start(site){
 const f=DF[D];resetControls();UI.abort=false;
 S={v:6,site,D,d:1,o2:Math.min(100,80*f.r),wa:Math.min(100,70*f.r),food:Math.min(100,60*f.r),en:60,h:100,parts:f.pt,cond:100,dust:0,dirty:0,log:[],ev:null,evk:null,over:null,tut:true,edu:'Radiação',
  m:{solar:2,oxy:1,rec:1,farm:1,shield:1,batt:1},on:{oxy:true,farm:true,rec:true},hist:[],
  fl:{i:0,res:[null,null,null,null],pts:0,rew:[0,0,0,0]},sw:{shield:false,eco:false,hold:false}};
 S.hist.push(vals());
 S.log.push('<p>Controle da Missão: bem-vindo, comandante! Mantenha os 4 astronautas vivos por '+MAXD+' dias até a nave de reabastecimento chegar.</p>');
 beep(520,120);render();
}
function resume(){
 const sv=store.get('save',null);
 if(!sv||!sv.S||sv.S.v!==6)return;
 S=sv.S;D=S.D;S.ev=null;UI.abort=false;S.sw=S.sw||{shield:false,eco:false,hold:false};resetControls();
 if(S.evk!=null&&EVENTS[S.evk])S.ev=EVENTS[S.evk]();else S.evk=null;
 S.tut=false;beep(520,100);render();
}
function save(){if(S&&!S.over)store.set('save',{S:Object.assign({},S,{ev:null})})}

function light(){let l=S.site==='lua'?((S.d>=11&&S.d<=16)?.1:1):.55;if(S.dust>0)l*=.25;if(S.dirty>0)l*=.6;return l}
function project(){
 const L=light(),e=eff()*(S.sw.eco?.92:1),prod=S.m.solar*10*L*e,on=S.on,m=S.m,
 use=(6+(NC()-4)*1.5+(S.site==='marte'?5:0)+(on.oxy?m.oxy*7:0)+(on.farm?m.farm*6*CR().en:0)+(on.rec?m.rec*4:0)+(S.sw.shield?6:0))*(S.sw.eco?.85:1),
 avail=S.en+prod,fr=avail>=use?1:Math.max(0,avail/use),rad=(S.site==='lua'?3.5:2.5)*sf()*DF[D].k*(S.sw.shield?.6:1),
 o2d=(on.oxy?m.oxy*3*fr*e:0)-NC(),wd=(on.rec?m.rec*2.5*fr*e:0)-NC()-(on.farm?m.farm*1.5*CR().w:0),fd=(on.farm?m.farm*2*CR().f*fr*e:0)-NC()*.75,ed=prod-use,
 neg=[[S.o2,o2d],[S.wa,wd],[S.food,fd],[S.en,ed]].filter(x=>x[1]<0).map(x=>x[0]/-x[1]);
 return{L,prod,use,fr,rad,e,o2d,wd,fd,ed,aut:neg.length?Math.floor(Math.min(...neg)):null,msv:rad/DF[D].k*(S.site==='lua'?.4:.27),en:Math.min(cap(),Math.max(0,avail-use)),hd:-rad-(S.food<=0?10:0)-(S.wa<=0?10:0)};
}
function build(k){const c=cost(k);if(S.parts<c||(k==='shield'&&S.m.shield>=4))return;S.parts-=c;S.m[k]++;beep(660,80);render()}
function toggle(k){S.on[k]=!S.on[k];beep(300,50);render()}
function maint(){if(S.parts<2)return;S.parts-=2;S.cond=Math.min(100,S.cond+35);S.log.unshift('<p>Manutenção feita: equipamentos em '+S.cond+'%.</p>');beep(600,80);render()}
function objs(){return[
 ['Sobreviver '+MAXD+' dias',S.d>MAXD&&S.h>0],
 ['Ter 2 ou mais estufas',S.m.farm>=2],
 ['Terminar com saúde acima de 60',S.h>60],
 ['Equipamentos acima de 50%',S.cond>50],
 ['Concluir 2 missões de pilotagem',S.fl.res.filter(v=>v!==null&&v>=75).length>=2]]}
function score(win){return Math.round(S.h*4+(S.o2+S.wa+S.food)/3*2+objs().filter(o=>o[1]).length*150+Math.round(S.fl.pts*.5)+(win?300:S.d*10)+((S.crew||4)-4)*40)}
function stars(sc){return sc>=1000?3:sc>=700?2:1}

function endDay(){
 const p=project(),en0=S.en;
 S.en=p.en;S.o2=clamp(S.o2+p.o2d,0,100);S.wa=clamp(S.wa+p.wd,0,100);S.food=clamp(S.food+p.fd,0,100);S.h=Math.max(0,S.h+p.hd);
 S.cond=Math.max(0,S.cond-3);S.parts+=2+Math.max(0,NC()-4);if(S.dust>0)S.dust--;if(S.dirty>0)S.dirty--;
 S.log.unshift('<p>Dia '+S.d+' encerrado. Energia '+sg(S.en-en0)+', O₂ '+sg(p.o2d)+', água '+sg(p.wd)+', comida '+sg(p.fd)+'.</p>');
 if(p.fr<1)S.log.unshift('<p class="tip">Faltou energia: os sistemas rodaram com '+Math.round(p.fr*100)+'% da força.</p>');
 if(S.food<=0||S.wa<=0)S.log.unshift('<p class="tip">Sem comida ou água a saúde cai rápido!</p>');
 S.d++;S.hist.push(vals());beep(440,90);
 if(S.o2<=0)return finish(false,'O oxigênio acabou. Sem ar, a missão foi abortada.');
 if(S.h<=0)return finish(false,'A tripulação adoeceu demais por causa da radiação, da fome ou da sede.');
 if(S.d>MAXD)return finish(true);
 if(S.site==='lua'&&S.d===9)S.log.unshift('<p class="tip">Aviso: a noite lunar começa no dia 11 e dura 6 dias. Sem sol os painéis não geram nada. Encha as baterias!</p>');
 else if(Math.random()<.3)S.log.unshift('<p class="fact">Você sabia? '+FACTS[Math.floor(Math.random()*FACTS.length)]+'</p>');
 if(S.log.length>40)S.log.length=40;
 if(Math.random()<DF[D].e){
  const pool=EVENTS.map((f,i)=>[f,i]).filter(x=>!x[0].s||x[0].s===S.site),pick=pool[Math.floor(Math.random()*pool.length)];
  S.ev=pick[0]();S.evk=pick[1];beep(220,300);buzz([250,80,250]);
 }
 render();
}
const E=(t,d,a,b,s)=>{const f=()=>({t,d,o:[a,b]});f.s=s;return f};
const EVENTS=[
 E('Tempestade solar','Partículas perigosas do Sol estão chegando. A blindagem faz diferença.',['Abrigar todos no módulo blindado','Gasta 10 de energia.',()=>{dn('en',10);S.h-=Math.round(10*sf());return 'Todos a salvo, com pouca radiação.'}],['Continuar trabalhando','Ganha 2 peças, mas arrisca a saúde.',()=>{S.parts+=2;S.h-=Math.round(26*sf());return 'Dose alta de radiação. Mais blindagem teria ajudado.'}]),
 E('Micrometeorito','Uma pedra veloz furou o casco e o ar escapa.',['Consertar agora','Gasta 2 peças.',()=>{dn('parts',2);return 'Remendo feito.'}],['Deixar para depois','Sem custo, mas perde oxigênio.',()=>{dn('o2',14);return 'O vazamento levou 14 de oxigênio.'}]),
 E('Tempestade de poeira','A poeira cobre os painéis. A luz cai por 3 dias.',['Aguentar com as baterias','Produção solar cai por 3 dias.',()=>{S.dust=3;return 'Painéis quase parados. Vigie a energia.'}],['Limpar os painéis','Gasta 8 de energia; a perda dura 1 dia.',()=>{dn('en',8);S.dust=1;return 'Painéis limpos.'}],'marte'),
 E('Poeira lunar nos painéis','A poeira da Lua é grudenta e cobre os painéis.',['Limpar os painéis','Gasta 6 de energia.',()=>{dn('en',6);return 'Painéis brilhando de novo.'}],['Ignorar','Painéis rendem menos por 2 dias.',()=>{S.dirty=2;return 'Painéis sujos geram menos energia.'}],'lua'),
 E('Praga na estufa','Insetos atacam as plantas.',['Tratar as plantas','Gasta 2 peças e 5 de energia.',()=>{dn('parts',2);dn('en',5);return 'Plantas salvas.'}],['Descartar folhas ruins','Perde 10 de comida.',()=>{dn('food',10);return 'Parte da comida foi descartada.'}]),
 E('Vazamento de água','Um cano rachou e a água está escapando.',['Reparar o cano','Gasta 2 peças.',()=>{dn('parts',2);return 'Cano reparado.'}],['Fechar a válvula e esperar','Perde 12 de água.',()=>{dn('wa',12);return 'Parte da água se perdeu.'}]),
 E('Falha de comunicação','A antena parou de falar com a Terra.',['Religar a antena','Gasta 4 de energia.',()=>{dn('en',4);return 'Contato restabelecido.'}],['Ficar sem contato','Sem custo, mas a tripulação fica tensa (-5 saúde).',()=>{S.h-=5;return 'Sem notícias de casa, o moral caiu.'}]),
 E('Equipamento com defeito','Um sistema começou a falhar por desgaste.',['Reparar agora','Gasta 3 peças e recupera 25% da condição.',()=>{dn('parts',3);S.cond=Math.min(100,S.cond+25);return 'Equipamento reparado.'}],['Seguir assim','Condição cai 20%.',()=>{dn('cond',20);return 'A eficiência dos sistemas caiu.'}]),
 E('Pedido da Terra','Cientistas pedem um experimento rápido: gasta energia e rende peças.',['Fazer o experimento','Gasta 8 de energia, ganha 3 peças.',()=>{dn('en',8);S.parts+=3;return 'Dados enviados. Peças ganhas.'}],['Adiar','Sem custo, sem ganho.',()=>'A Terra entendeu.']),
 E('Falha térmica','O sistema de refrigeração dos trajes oscila e o calor sobe nos módulos.',['Ajustar o resfriamento','Gasta 6 de energia.',()=>{dn('en',6);return 'Temperatura estabilizada.'}],['Aguentar o calor','Sem custo, mas a saúde cai 6 e os equipamentos 10%.',()=>{S.h-=6;dn('cond',10);return 'A tripulação suou, e as máquinas também.'}]),

function finish(win,why){
 const sc=score(win),key=S.site+'-'+S.D,rec=sc>(best[key]||0);

/* ---------- Pilotagem ---------- */
const effPos=()=>{const h=prefs.profile==='hosas';return{x:clamp(C.jx+(h?C.lx*.3:0),-1,1),y:clamp(C.jy,-1,1)}};
function flightScore(){
 const m=FLIGHT_MISSIONS[S.fl.i],g=goal();
 const ep=effPos(),pos=Math.hypot(ep.x-g.x,ep.y-g.y)/1.5,throttle=(Math.abs(C.th[0]-g.th)+Math.abs(C.th[1]-g.th))/2,balance=Math.abs(C.th[0]-C.th[1]),yaw=Math.abs(C.yaw)/30;
 let score=100-(pos*48+throttle*35+balance*22+yaw*18);
 for(const o of m.obstacles){const d=Math.hypot(ep.x-o.x,ep.y-o.y);if(d<o.r)score-=Math.round((o.r-d)/o.r*32)}
 if(S.sw&&S.sw.hold)score=Math.min(score,89);
 return Math.round(clamp(score,0,100));
}
const unlockedMission=i=>i===0||S.fl.res.slice(0,i).every(v=>v!==null&&v>=75);
function selectFlightMission(i){
 if(!unlockedMission(i)){say('Conclua a missão anterior com pelo menos 75 pontos para liberar esta.');return}
 S.fl.i=i;resetControls();render();
}
function tryDock(){
 const sc=flightScore(),i=S.fl.i,old=S.fl.res[i];C.attempts++;C.lastScore=sc;
 if(old===null||sc>old){S.fl.res[i]=sc;S.fl.pts=S.fl.res.reduce((a,v)=>a+(v||0),0)}
 let extra='';buzz(sc>=75?[60,40,60]:[140]);
 if(sc>=75&&!S.fl.rew[i]){const g=sc>=90?2:1;S.fl.rew[i]=1;S.parts+=g;extra=` Bônus: +${g} peça${g>1?'s':''} para a oficina!`;S.log.unshift(`<p class="fact">Pilotagem: missão "${FLIGHT_MISSIONS[i].name}" concluída com ${sc} pontos. +${g} peça(s).</p>`)}
 if(sc>=75)say(`Missão concluída! ${sc} pontos. ${sc>=90?'Medalha de ouro!':'Boa pilotagem!'}${extra}`);
 else say(`Você fez ${sc} pontos. Precisa de 75 para concluir; ajuste os controles e tente novamente.`);
 render();
}

function missionRadar(m){

 return `<svg viewBox="0 0 120 120" role="img" aria-label="Radar da missão: marcador azul é o alvo, área vermelha é obstáculo"><rect x="5" y="5" width="110" height="110" rx="8" fill="#081321" stroke="#38536d"/><path d="M60 8V112M8 60H112M30 30L90 90M90 30L30 90" stroke="#233a55" stroke-width="1"/>${obs}<circle cx="${px(m.goal.x)}" cy="${py(m.goal.y)}" r="5" fill="#63ddff" stroke="#e5fbff" stroke-width="2"/><circle class="fcraft" cx="${px(effPos().x)}" cy="${py(effPos().y)}" r="4" fill="#ffc45c" stroke="#fff" stroke-width="1.5"/><text x="60" y="10" text-anchor="middle" fill="#9fb0c8" font-size="6">RADAR DE ATITUDE</text></svg>`;

function flightTelemetryUI(){

 const od=Math.min(...m.obstacles.map(o=>Math.hypot(ep.x-o.x,ep.y-o.y)-o.r)),safe=od>0;
 const put=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
 put('flight-distance',distance+'%');put('flight-preview-score',score+'/100');put('flight-obstacle',safe?'LIVRE':'ATENÇÃO');
 put('flight-clearance',safe?'Margem '+Math.round(od*100)+'%':'Dentro da zona');
 put('flight-motors',Math.round(C.th[0]*100)+'% / '+Math.round(C.th[1]*100)+'%');put('flight-yaw',(C.yaw>0?'+':'')+Math.round(C.yaw)+'°');

 const mm=document.getElementById('flight-motors-line');if(mm)mm.textContent=`Motores: ${Math.round(C.th[0]*100)}% / ${Math.round(C.th[1]*100)}% · Guinada: ${Math.round(C.yaw)}°`;

let TRE=null;
function setLang(){TRE=null;try{document.documentElement.lang={pt:'pt-BR',en:'en',es:'es',fr:'fr'}[prefs.lang];document.title={pt:'Posto Avançado · Centro de Controle',en:'Forward Outpost · Control Center',es:'Puesto Avanzado · Centro de Control',fr:'Poste Avancé · Centre de Contrôle'}[prefs.lang]}catch(e){}}
function tr(h){const L=LANGS.indexOf(prefs.lang);if(L<1)return h;
 if(!TRE){const rows=I18N.filter(r=>r[L]).sort((a,b)=>b[0].length-a[0].length);let off=1;TRE={rows:[]};
  const parts=rows.map(r=>{const n=(r[0].match(/#/g)||[]).length;TRE.rows.push({o:off,t:r[L]});off+=1+n;return '('+r[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/#/g,'(\\d+(?:[.,]\\d+)?)')+')'});
  TRE.re=new RegExp('(?<!\\p{L})(?:'+parts.join('|')+')(?!\\p{L})','gu')}
 return h.replace(TRE.re,(...a)=>{for(const r of TRE.rows)if(a[r.o]!==undefined){let k=r.o;return r.t.replace(/#/g,()=>a[++k])}return a[0]})}
const langBtns=()=>`<span class="chs" role="group" aria-label="Idioma / Language">${LANGS.map(l=>`<button class="ch" lang="${l}" aria-pressed="${prefs.lang===l}" data-act="lang" data-arg="${l}" data-fk="l${l}">${LN[l]}</button>`).join('')}</span>`;

 app.innerHTML=tr(S?gameView():intro());
 try{document.body.classList.toggle('head-on',!!prefs.head)}catch(e){}
 if(S)window.scrollTo(0,scrollY);
 flightTelemetryUI();
 const mk=!S?'':S.ev?'ev':S.over?'over':UI.abort?'abort':S.tut?'tut':'';

 if(mk&&mk!==modalKey&&modal){const b=modal.querySelector('button');if(b)b.focus()}
 else if(modal&&fk===null){const b=modal.querySelector('button');if(b&&!modal.contains(document.activeElement))b.focus()}
 else if(fk){const el=app.querySelector(`[data-fk="${fk}"]`);if(el&&!modal)el.focus({preventScroll:true})}
 modalKey=mk;updateSecondary();
 save();
 if(nasaData&&nasaData.query===nq())paintNasa();else refreshNasa();
}

let drag=null;
function rawXY(e,el){const r=el.getBoundingClientRect();return[clamp(((e.clientX-r.left)/r.width-.5)*2.4,-1,1),clamp(((e.clientY-r.top)/r.height-.5)*2.4,-1,1)]}
function joyAt(e,el){const[x,y]=rawXY(e,el);C.jx=clamp(shape(x)*prefs.sens,-1,1);C.jy=clamp(shape(y)*prefs.sens*(prefs.invY?-1:1),-1,1);att()}
function lAt(e,el){const[x,y]=rawXY(e,el);C.lx=shape(x);C.ly=shape(y)*(prefs.invY?-1:1);att()}
function levAt(i,y,el){const r=el.getBoundingClientRect();setTh(i,1-(y-r.top)/r.height);levUI(i)}
function spring(){if(drag)return;C.jx*=.8;C.jy*=.8;if(Math.abs(C.jx)<.02&&Math.abs(C.jy)<.02)C.jx=C.jy=0;att();if(C.jx||C.jy)requestAnimationFrame(spring)}
app.addEventListener('pointerdown',e=>{
 const el=e.target.closest('[data-ctl]');if(!el)return;const k=el.dataset.ctl;
 if(k==='joy'||k==='lstick'||k[0]==='t'){e.preventDefault();drag={k,el};try{el.setPointerCapture(e.pointerId)}catch(_){}if(k==='joy')joyAt(e,el);else if(k==='lstick')lAt(e,el);else levAt(+k[2],e.clientY,el)}
 else{setPed(k,true);beep(260,40)}
});
app.addEventListener('pointermove',e=>{if(!drag)return;if(drag.k==='joy')joyAt(e,drag.el);else if(drag.k==='lstick')lAt(e,drag.el);else levAt(+drag.k[2],e.clientY,drag.el)});
function rel(){if(drag){const k=drag.k;drag=null;if(k==='joy'){spring();beep(330,50)}else if(k==='lstick')beep(330,50);else beep(200+Math.round(C.th[+k[2]]*600),60)}}
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
app.addEventListener('keydown',e=>{
 const el=e.target.closest('[data-ctl],.ck-clk');if(!el)return;
 if(el.matches('.ck-clk')){if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}return}
 const k=el.dataset.ctl;
 if(k[0]==='t'){const i=+k[2],d={ArrowUp:.05,ArrowDown:-.05}[e.key];if(e.key==='Home')setTh(i,1);else if(e.key==='End')setTh(i,0);else if(d)setTh(i,C.th[i]+d);else return;e.preventDefault();levUI(i)}
 else if(k==='lstick'){const m={ArrowLeft:[-.25,0],ArrowRight:[.25,0],ArrowUp:[0,-.25],ArrowDown:[0,.25]}[e.key];if(!m)return;e.preventDefault();C.lx=clamp(C.lx+m[0],-1,1);C.ly=clamp(C.ly+m[1],-1,1);att()}
 else if(k==='joy'){const m={ArrowLeft:[-.25,0],ArrowRight:[.25,0],ArrowUp:[0,-.25],ArrowDown:[0,.25]}[e.key];if(!m)return;e.preventDefault();C.jx=clamp(C.jx+m[0],-1,1);C.jy=clamp(C.jy+m[1],-1,1);att()}
 else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)setPed(k,true)}
});
app.addEventListener('keyup',e=>{const el=e.target.closest('[data-ctl]');if(el&&el.dataset.ctl==='joy'&&!drag)spring()});
window.addEventListener('keydown',e=>{
 if(e.key==='Tab'){ // prende o foco dentro do modal aberto
  const m=document.querySelector('.modal');
  if(m){const f=[...m.querySelectorAll('button:not(:disabled)')];if(f.length){const i=f.indexOf(document.activeElement);
   if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}}
  return;
 }
 if(!S)return;
 if(e.key==='Escape'){if(UI.abort){UI.abort=false;render()}else if(S.tut){S.tut=false;render()}return}
 if(document.querySelector('.modal')||e.ctrlKey||e.metaKey||e.altKey||e.repeat||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const k=e.key.toLowerCase();
 if(k==='q'||k==='e'){e.preventDefault();setPed(k==='q'?'pl':'pr',true);beep(260,35)}
 else if(k==='w'||k==='s'){e.preventDefault();const d=k==='w'?.05:-.05;setTh(0,C.th[0]+d);if(!C.link)setTh(1,C.th[1]+d);levUI(0);levUI(1)}
 else if(k==='c'&&!e.target.closest('[data-ctl]')){e.preventDefault();centerAll();say('Controles centralizados.')}
});

const memCache={},TTL=30*60*1000;
async function cachedJson(key,url,force){

 if(!force){
  if(memCache[key]&&now-memCache[key].t<TTL)return memCache[key].v;
  try{const s=JSON.parse(sessionStorage.getItem('pa6n:'+key)||'null');if(s&&now-s.t<TTL){memCache[key]=s;return s.v}}catch(e){}
 }
 const r=await fetch(url,{headers:{Accept:'application/json'}});
 if(!r.ok)throw new Error(r.status===429?'limite':'HTTP '+r.status);
 const v=await r.json(),o={t:now,v};memCache[key]=o;
 try{sessionStorage.setItem('pa6n:'+key,JSON.stringify(o))}catch(e){}
 return v;
}

   if(p.axes.length>2&&Math.abs(ax(2))>dz+.05){C.yaw=clamp(ax(2)*30,-30,30);ch=true}
   if(p.axes.length>3&&pv.a[3]!==undefined&&Math.abs(ax(3)-pv.a[3])>.01){const v=(1-ax(3))/2;setTh(0,v);if(!C.link)setTh(1,v);ch=true}
   pv.a=[...p.axes];
  }
  if(btn(0)&&!pv.b[0])tryDock();
  if(btn(1)&&!pv.b[1]){centerAll();say('Controles centralizados.')}
  pv.b[0]=btn(0);pv.b[1]=btn(1);
 }
 return ch;
}

/* ---------- Laço de voo: manetes, hold, controles USB, tátil ---------- */
let lastT=0,lastSig='';
function tick(ts){
 const dt=Math.min(.05,((ts-lastT)/1000)||0);lastT=ts;
 try{
  if(S&&!S.over){
   const busy=!!(S.ev||UI.abort||S.tut);
   if(!busy)pollPads();else padL=false;
   const hosas=prefs.profile==='hosas';
   if((hosas||padL)&&Math.abs(C.ly)>.05&&!busy){const d=-C.ly*dt*.7;setTh(0,C.th[0]+d);if(!C.link)setTh(1,C.th[1]+d)}
   if(!(drag&&drag.k==='lstick')&&!padL&&(C.lx||C.ly)){const f=Math.pow(.002,dt);C.lx*=f;C.ly*=f;if(Math.abs(C.lx)<.01)C.lx=0;if(Math.abs(C.ly)<.01)C.ly=0}
   if(S.sw&&S.sw.hold&&C.yaw){C.yaw*=Math.pow(.25,dt);if(Math.abs(C.yaw)<.4)C.yaw=0;pedUI()}
   const sig=[C.jx,C.jy,C.lx,C.ly,C.yaw,C.th[0],C.th[1]].map(v=>v.toFixed(3)).join();
   if(sig!==lastSig){lastSig=sig;att();levUI(0);levUI(1);pedUI()}
   Rumble.set(busy&&S.ev?.9:(C.th[0]+C.th[1])/2*(S.ev?1.4:1));
  }else Rumble.set(0);
 }catch(e){}
 requestAnimationFrame(tick);
}
